<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Wedding RSVP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>RSVP</h1>

  <form id="rsvp-form">

    <label>Name</label>
    <input type="text" name="name" required>

    <label>Phone / Contact Information (optional)</label>
    <input type="tel" name="contact" placeholder="+91 9XXXXXXXXX">

    <label>Will you attend?</label>
    <select name="attending" id="attending" required>
      <option value="">Select</option>
      <option value="Yes">Yes</option>
      <option value="No">No</option>
    </select>

    <div id="yes-fields" style="display:none;">

      <label>Number of Guests *</label>
      <input type="number" name="guests" min="1">

      <label>Arrival Date</label>
      <input type="date" name="arrival_date">

      <label>Arrival Time</label>
      <input type="time" name="arrival_time">

      <label>Departure Date</label>
      <input type="date" name="departure_date">

      <label>Departure Time</label>
      <input type="time" name="departure_time">

    </div>

    <button type="submit">Submit RSVP</button>

  </form>
</div>

<script>
const form = document.getElementById("rsvp-form");
const attendingSelect = document.getElementById("attending");
const yesFields = document.getElementById("yes-fields");

attendingSelect.addEventListener("change", () => {
  if (attendingSelect.value === "Yes") {
    yesFields.style.display = "block";
    form.guests.required = true;
  } else {
    yesFields.style.display = "none";
    form.guests.required = false;
  }
});

form.addEventListener("submit", e => {
  e.preventDefault();

  const data = new FormData(form);
  const params = new URLSearchParams(data);

  fetch("https://script.google.com/macros/s/AKfycbyhfuojB3Y754misWu0DKfZZFkfuwLbdcck8vrvQD4u0evrcgoC2Mc2AnzxVtaw54Xk/exec", {
    method: "POST",
    body: params
  })
  .then(res => res.json())
  .then(() => {
    window.location.href = "honeymoon.html";
  })
  .catch(() => {
    alert("Something went wrong. Please try again.");
  });
});
</script>

</body>
</html>
